<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏏 CricketEdge — Statistical Cricket Performance Analyzer</title>
  <meta name="description" content="Live R Shiny application running live on Vercel" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* Top Status Bar */
    .live-status-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 0.76rem;
      color: #94a3b8;
      z-index: 9999;
    }
    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .status-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-links a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.1);
      transition: all 0.2s;
    }
    .status-links a:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #ffffff;
    }

    /* Full-Screen Shiny App Frame */
    .shiny-frame {
      position: absolute;
      top: 36px;
      left: 0;
      width: 100%;
      height: calc(100% - 36px);
      border: none;
      background: #070b12;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      top: 36px;
      left: 0;
      width: 100%;
      height: calc(100% - 36px);
      background: #070b12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      font-family: monospace;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Live Status Bar -->
  <div class="live-status-bar">
    <div class="status-left">
      <span class="pulse-dot"></span>
      <span>Live R Shiny Engine (Connected to Port 3838)</span>
      <span style="color: #64748b;">|</span>
      <span style="color: #94a3b8;">CricketEdge v1.0.0</span>
    </div>
    <div class="status-links">
      <a href="https://hydrocodone-super-combat-prizes.trycloudflare.com" target="_blank">🔗 Direct Fullscreen Shiny</a>
      <a href="CricketEdge_Lab_Report.pdf" target="_blank">📄 Lab Report PDF</a>
      <a href="CricketEdge_Lab_Report.docx" download>📥 Lab Report Word</a>
    </div>
  </div>

  <!-- Loading State -->
  <div class="loading-overlay" id="loader">
    <div class="spinner"></div>
    <div>Connecting to Live R Shiny Session (http://127.0.0.1:3838)...</div>
  </div>

  <!-- Full-Screen Live Shiny App -->
  <iframe
    src="https://hydrocodone-super-combat-prizes.trycloudflare.com"
    class="shiny-frame"
    allow="clipboard-read; clipboard-write"
    onload="document.getElementById('loader').style.display='none';"
  ></iframe>

</body>
</html>
